version: '3.8'

services:
  db_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow_metadata
    ports:
      - "5433:5432"
    volumes:
      - pipeline_projet_commandes:/var/lib/postgresql/data
      - ./configuration/01_init_bdd.sql:/docker-entrypoint-initdb.d/01_init_bdd.sql

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db_postgres:5432/airflow_metadata
    depends_on:
      - db_postgres
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db_postgres:5432/airflow_metadata
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./donnees:/opt/airflow/donnees
      - ./brutes:/opt/airflow/brutes
    depends_on:
      - airflow-init
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db_postgres:5432/airflow_metadata
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./donnees:/opt/airflow/donnees
      - ./brutes:/opt/airflow/brutes
    depends_on:
      - airflow-init
    command: scheduler

volumes:
  pipeline_projet_commandes: